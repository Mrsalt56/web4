
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Music Player</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<div class="player">

<iframe id="player" allow="autoplay"></iframe>

<h2 id="title">Nothing Playing</h2>
<p id="artist"></p>

<div class="controls">
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>

</div>

<div class="main">

<input id="search" placeholder="Search music">

<div id="results"></div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
