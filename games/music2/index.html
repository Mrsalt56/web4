<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Music System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="player">
    <h2 id="nowPlaying">Not Playing</h2>

    <audio id="audio" controls></audio>
  </div>

  <div class="search">

    <div class="search-bar">
      <input id="query" type="text" placeholder="Search any song or artist">
      <button onclick="search()">Search</button>
    </div>

    <div id="results"></div>

  </div>

</div>

<script src="app.js"></script>
</body>
</html>
