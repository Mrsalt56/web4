
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Imp Music</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <h1>🎵 Imp Music</h1>
    <button>Search</button>
  </div>

  <!-- Main -->
  <div class="main">

    <div class="search-bar">
      <input id="query" placeholder="Search artist or song">
      <button onclick="search()">Search</button>
    </div>

    <h2 id="resultsTitle"></h2>

    <div id="grid" class="grid"></div>

  </div>

</div>

<!-- Bottom Player -->
<div class="player-bar">

  <img id="cover" src="" />

  <div class="info">
    <div id="song">Not Playing</div>
    <div id="artist"></div>
  </div>

  <div class="controls">
    <button onclick="toggle()">⏯</button>
  </div>

</div>

<div id="ytplayer"></div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>

</body>
</html>
