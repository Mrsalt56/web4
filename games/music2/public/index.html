
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>YouTube Music System</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="player">
    <h2 id="nowPlaying">Not Playing</h2>
    <div id="player"></div>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="playCurrent()">▶</button>
      <button onclick="next()">⏭</button>
    </div>
  </div>

  <div class="search">

    <div class="bar">
      <input id="query" placeholder="Search song or artist">
      <button onclick="addToPlaylist()">Add</button>
    </div>

    <div id="playlist"></div>

  </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
</body>
</html>
