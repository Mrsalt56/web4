
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Music</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<div class="player" id="player">

<div class="logo">♫</div>

<img id="cover">

<div id="title">Nothing Playing</div>
<div id="artist"></div>

<input type="range" id="progress">

<div class="controls">
<button onclick="prev()">⏮</button>
<button onclick="toggle()">▶</button>
<button onclick="next()">⏭</button>
</div>

</div>


<div class="main">

<div class="topbar">
<input id="search" placeholder="Search songs..." onkeydown="if(event.key==='Enter') search()">
</div>

<div class="tabs">
<button onclick="showTrending()">Trending</button>
<button onclick="showRecent()">Recently Played</button>
<button onclick="showPlaylist()">Playlist</button>
</div>

<div id="results" class="results"></div>

</div>

</div>

<audio id="audio"></audio>

<script src="app.js"></script>

</body>
</html>
