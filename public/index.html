
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Imp Music</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <div class="sidebar">
    <h1>🎵 Imp Music</h1>
    <button onclick="loadTrending()">Home</button>
  </div>

  <div class="main">

    <div class="search-bar">
      <input id="query" placeholder="Search artist or song">
      <button onclick="search()">Search</button>
    </div>

    <h2 id="sectionTitle">Trending Music (US)</h2>
    <div id="grid" class="grid"></div>

  </div>
</div>

<div id="videoDrawer" class="video-drawer hidden">
  <button class="close-btn" onclick="closeVideo()">✖</button>
  <div id="ytplayer"></div>
</div>

<div class="player-bar">
  <button id="openVideoBtn" class="drawer-btn hidden" onclick="openVideo()">^</button>
  <img id="cover" src="" />
  <div class="info">
    <div id="song">Not Playing</div>
    <div id="artist"></div>
  </div>
  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button id="playBtn" onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="app.js"></script>
</body>
</html>
